<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TickMate · 番茄专注</title>
<style>
:root{
  --surface-app:#FFFFFF; --surface-sidebar:#F7F7F8; --surface-hover:#F2F3F5;
  --surface-selected:#EBF0FE; --surface-elevated:#FFFFFF;
  --text-primary:#1F2329; --text-secondary:#646A73; --text-tertiary:#8F959E;
  --border-default:#E5E6EB; --border-subtle:#EFF0F1;
  --accent:#4772FA; --accent-hover:#3A63E8; --accent-soft:rgba(71,114,250,.12);
  --p-high:#E5484D; --success:#3BA55D;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;font-size:14px;color:var(--text-primary);background:var(--surface-app);-webkit-font-smoothing:antialiased;overflow:hidden}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}
.icon.xs{width:14px;height:14px}
.shell{display:grid;grid-template-rows:36px minmax(0,1fr);height:100vh}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.titlebar{display:flex;align-items:center;background:var(--surface-sidebar);border-bottom:1px solid var(--border-subtle);user-select:none}
.titlebar .brand{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:13px}
.titlebar .brand .mark{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#fff}
.titlebar .win{margin-left:auto;display:flex;height:100%}
.titlebar .win button{width:44px;height:100%;border:0;background:transparent;color:var(--text-secondary);display:grid;place-items:center;cursor:pointer}
.titlebar .win button:hover{background:var(--surface-hover)}
.titlebar .win button.close:hover{background:#E5484D;color:#fff}
.sidebar{background:var(--surface-sidebar);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;padding:12px 8px 8px}
.search{display:flex;align-items:center;gap:8px;height:32px;margin:0 4px 12px;padding:0 10px;border-radius:6px;background:var(--surface-hover);color:var(--text-tertiary);font-size:13px}
.nav{flex:1;overflow:auto;min-height:0}
.group-label{padding:8px 12px 4px;font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:.05em}
.nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-radius:6px;color:var(--text-primary);cursor:default;font-size:14px}
.nav-item .icon{color:var(--text-secondary)}
.nav-item:hover{background:var(--surface-hover)}
.nav-item.selected{background:var(--surface-selected);color:var(--accent);font-weight:500}
.nav-item.selected .icon{color:var(--accent)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.nav-item .count.badge{color:var(--accent);font-weight:600}
.ldot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 8px 0 4px}
.side-foot{border-top:1px solid var(--border-subtle);padding-top:6px;margin-top:6px;display:flex;flex-direction:column}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.focus-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 24px 8px}
.state-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.02em}
.state-chip .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.linked-task{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:6px;border:1px solid var(--border-default);font-size:13px;color:var(--text-primary);background:var(--surface-elevated)}
.linked-task .ldot{margin:0}
.linked-task .icon.xs{color:var(--text-tertiary)}
.ring-wrap{position:relative;width:190px;height:190px;margin:14px 0 4px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:var(--border-subtle)}
.ring-fg{stroke:var(--accent);transition:stroke-dashoffset .2s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer{font-family:"Cascadia Mono","Consolas",monospace;font-size:44px;font-weight:600;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums}
.ring-center .phase{font-size:12px;color:var(--text-tertiary);margin-top:6px}
.pomo-dots{display:flex;gap:8px;margin-top:8px}
.pomo-dots span{width:8px;height:8px;border-radius:50%;background:var(--border-default)}
.pomo-dots span.on{background:var(--accent)}
.controls{display:flex;gap:12px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 20px;border-radius:8px;font-size:14px;border:1px solid transparent;cursor:default;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:var(--border-default);color:var(--text-primary);background:transparent}
.btn.ghost:hover{background:var(--surface-hover)}
.btn:active{transform:scale(.98)}

.stats{display:grid;grid-template-columns:repeat(3,200px);gap:14px;justify-content:center;margin:14px 0 4px}
.stat{border:1px solid var(--border-default);border-radius:10px;padding:12px 16px;text-align:center}
.stat .num{font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat .num em{font-style:normal;font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:3px}
.stat .lab{font-size:12px;color:var(--text-tertiary);margin-top:3px}

.today-log{width:640px;margin:10px auto 18px;border:1px solid var(--border-default);border-radius:10px;overflow:hidden}
.log-head{display:flex;align-items:center;padding:9px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border-subtle);background:var(--surface-sidebar)}
.log-head span{margin-left:auto;font-size:12px;font-weight:400;color:var(--text-tertiary)}
.log-row{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border-subtle);font-size:13px}
.log-row:last-child{border-bottom:0}
.log-row .time{font-family:"Cascadia Mono","Consolas",monospace;color:var(--text-secondary);font-size:12px;width:110px}
.log-row .ltask{flex:1}
.log-row .len{color:var(--text-tertiary);font-size:12px}
.log-row .ok{color:var(--success)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M6.5 12.5l3.5 3.5 7.5-8"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="i-week" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5V17a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-3.5"/><path d="M3.5 13.5h4.6l1.4 2.3h5l1.4-2.3h4.6"/><path d="M5.3 13.5L8 6.2A1.6 1.6 0 0 1 9.5 5h5a1.6 1.6 0 0 1 1.5 1.2l2.7 7.3"/></symbol>
<symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-5"/></symbol>
<symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9.5 2.5h5M12 2.5V6"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3s5.5 4.2 5.5 9a5.5 5.5 0 0 1-11 0c0-2 1-3.8 2-5 .3 1.2 1 2.3 2 2.5-.5-2.5.5-5 1.5-6.5z"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.07 4.2l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></symbol>
<symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11" stroke-width="2"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 8.5A8 8 0 1 1 4 12"/><path d="M4.5 3.5v5h5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-min" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
<symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
</defs></svg>

<div class="shell">
  <div class="titlebar">
    <div class="brand"><span class="mark"><svg class="icon xs" style="stroke-width:2.5"><use href="#i-logo"/></svg></span>TickMate</div>
    <div class="win">
      <button><svg class="icon sm"><use href="#i-min"/></svg></button>
      <button><svg class="icon sm"><use href="#i-max"/></svg></button>
      <button class="close"><svg class="icon sm"><use href="#i-x"/></svg></button>
    </div>
  </div>

  <div class="body">
    <aside class="sidebar">
      <div class="search"><svg class="icon sm"><use href="#i-search"/></svg>搜索</div>
      <nav class="nav">
        <div class="group-label">智能清单</div>
        <div class="nav-item"><svg class="icon sm"><use href="#i-sun"/></svg>今天<span class="count badge">4</span></div>
        <div class="nav-item"><svg class="icon sm"><use href="#i-clock"/></svg>明天<span class="count">2</span></div>
        <div class="nav-item"><svg class="icon sm"><use href="#i-week"/></svg>最近 7 天<span class="count">9</span></div>
        <div class="nav-item"><svg class="icon sm"><use href="#i-inbox"/></svg>全部<span class="count">16</span></div>
        <div class="nav-item"><svg class="icon sm"><use href="#i-done"/></svg>已完成<span class="count">42</span></div>
        <div class="group-label" style="margin-top:8px">清单</div>
        <div class="nav-item"><span class="ldot" style="background:#4772FA"></span>工作<span class="count">3</span></div>
        <div class="nav-item"><span class="ldot" style="background:#64B94C"></span>生活<span class="count">5</span></div>
        <div class="nav-item"><span class="ldot" style="background:#F5A623"></span>购物<span class="count">4</span></div>
        <div class="side-foot" style="border:0;padding:0;margin-top:10px">
          <div class="nav-item selected"><svg class="icon sm"><use href="#i-timer"/></svg>番茄专注<span class="count">3</span></div>
          <div class="nav-item"><svg class="icon sm"><use href="#i-flame"/></svg>习惯打卡<span class="count">2/4</span></div>
          <div class="nav-item"><svg class="icon sm"><use href="#i-gear"/></svg>设置</div>
        </div>
      </nav>
    </aside>

    <section class="main">
      <div class="focus-wrap">
        <span class="state-chip"><span class="pulse"></span>专注中</span>
        <span class="linked-task"><span class="ldot" style="background:#4772FA"></span>写季度周报 · 工作<svg class="icon xs"><use href="#i-chev-d"/></svg></span>

        <div class="ring-wrap">
          <svg width="190" height="190" viewBox="0 0 190 190">
            <circle class="ring-bg" cx="95" cy="95" r="85" fill="none" stroke-width="10"/>
            <circle class="ring-fg" cx="95" cy="95" r="85" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="320"/>
          </svg>
          <div class="ring-center">
            <div class="timer">15:00</div>
            <div class="phase">第 3 个番茄 · 剩余 10 分钟</div>
          </div>
        </div>
        <div class="pomo-dots"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>

        <div class="controls">
          <span class="btn primary"><svg class="icon sm"><use href="#i-pause"/></svg>暂停</span>
          <span class="btn ghost"><svg class="icon sm"><use href="#i-reset"/></svg>重置</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="num">3<em>个</em></div><div class="lab">今日番茄</div></div>
        <div class="stat"><div class="num">75<em>分钟</em></div><div class="lab">今日专注</div></div>
        <div class="stat"><div class="num">6<em>天</em></div><div class="lab">连续专注</div></div>
      </div>

      <div class="today-log">
        <div class="log-head">今日专注记录<span>共 3 次番茄</span></div>
        <div class="log-row"><span class="time">09:00 - 09:25</span><span class="ltask"><span class="ldot" style="background:#4772FA;width:6px;height:6px;margin:0 6px 0 0"></span>写季度周报</span><span class="len">25 分钟</span><svg class="icon sm ok"><use href="#i-check"/></svg></div>
        <div class="log-row"><span class="time">10:00 - 10:25</span><span class="ltask"><span class="ldot" style="background:#64B94C;width:6px;height:6px;margin:0 6px 0 0"></span>阅读技术文档</span><span class="len">25 分钟</span><svg class="icon sm ok"><use href="#i-check"/></svg></div>
        <div class="log-row"><span class="time">11:00 - 11:25</span><span class="ltask"><span class="ldot" style="background:#4772FA;width:6px;height:6px;margin:0 6px 0 0"></span>写季度周报</span><span class="len">25 分钟</span><svg class="icon sm ok"><use href="#i-check"/></svg></div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
