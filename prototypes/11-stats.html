<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TickMate · 统计报表</title>
<style>
:root{
  --surface-app:#FFFFFF; --surface-sidebar:#F7F7F8; --surface-hover:#F2F3F5;
  --surface-selected:#EBF0FE; --surface-elevated:#FFFFFF;
  --text-primary:#1F2329; --text-secondary:#646A73; --text-tertiary:#8F959E;
  --border-default:#E5E6EB; --border-subtle:#EFF0F1;
  --accent:#4772FA; --accent-hover:#3A63E8; --accent-soft:rgba(71,114,250,.15);
  --p-high:#E5484D; --success:#3BA55D;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;font-size:14px;color:var(--text-primary);background:var(--surface-app);-webkit-font-smoothing:antialiased;overflow:hidden}
.icon{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.shell{display:grid;grid-template-rows:36px minmax(0,1fr);height:100vh}
.titlebar{display:flex;align-items:center;background:var(--surface-sidebar);border-bottom:1px solid var(--border-subtle);user-select:none}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:13px}
.brand .mark{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#fff}
.ldot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 8px 0 4px}
.sidebar{background:var(--surface-sidebar);border-right:1px solid var(--border-subtle);padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-radius:6px;color:var(--text-primary);font-size:14px}
.nav-item.selected{background:var(--surface-selected);color:var(--accent);font-weight:500}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.main-head{display:flex;align-items:flex-end;gap:12px;padding:20px 24px 16px;position:sticky;top:0;background:var(--surface-app);z-index:2}
.main-head h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.main-head .sub{font-size:13px;color:var(--text-secondary);padding-bottom:2px}
.range{margin-left:auto;display:flex;background:var(--surface-hover);border-radius:6px;padding:2px}
.range button{padding:4px 14px;border-radius:4px;font-size:13px;color:var(--text-secondary);border:0;background:transparent;cursor:default}
.range button.on{background:var(--surface-app);color:var(--text-primary);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.content{padding:0 24px 28px;display:flex;flex-direction:column;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--border-default);border-radius:10px;padding:16px 20px;background:var(--surface-elevated)}
.kpi .num{font-size:26px;font-weight:600;letter-spacing:-.01em}
.kpi .num em{font-style:normal;font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:3px}
.kpi .lab{font-size:12px;color:var(--text-tertiary);margin-top:3px}
.kpi .delta{font-size:11.5px;margin-top:6px;color:var(--success)}
.kpi .delta.down{color:var(--p-high)}

.card{border:1px solid var(--border-default);border-radius:10px;background:var(--surface-elevated)}
.card-head{display:flex;align-items:center;padding:14px 20px 0;font-size:13px;font-weight:600}
.card-head .sub{margin-left:auto;font-size:12px;font-weight:400;color:var(--text-tertiary)}
.card-body{padding:14px 20px 18px}

/* 热力图 */
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;width:100%}
.heat-cell{border-radius:3px;background:var(--border-subtle);aspect-ratio:1;width:100%}
.heat-cell.l1{background:#C7D7FE}.heat-cell.l2{background:#8FAEFC}.heat-cell.l3{background:#5B84FF}.heat-cell.l4{background:#2C56D6}
.heat-months{display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.heat-months span:nth-child(1){grid-column:1/3}
.heat-months span:nth-child(2){grid-column:5/7}
.heat-months span:nth-child(3){grid-column:11/13}
.heat-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--text-tertiary);justify-content:flex-end}
.lg-cell{width:12px;height:12px;border-radius:3px;background:var(--border-subtle)}
.lg-cell.l1{background:#C7D7FE}.lg-cell.l2{background:#8FAEFC}.lg-cell.l3{background:#5B84FF}.lg-cell.l4{background:#2C56D6}

/* 完成趋势柱状 */
.trend{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px}
.trend .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.trend .bar .col{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--accent)}
.trend .bar.today .col{background:var(--accent-hover)}
.trend .bar .v{font-size:10.5px;color:var(--text-tertiary)}
.trend .bar .d{font-size:10.5px;color:var(--text-tertiary)}

/* 分布横条 */
.dist{display:flex;flex-direction:column;gap:12px}
.dist-row{display:grid;grid-template-columns:80px 1fr 64px;align-items:center;gap:12px;font-size:13px}
.dist-row .name{display:flex;align-items:center;gap:6px;color:var(--text-primary)}
.dist-row .track{height:8px;border-radius:4px;background:var(--border-subtle);overflow:hidden}
.dist-row .fill{height:100%;border-radius:4px}
.dist-row .num{text-align:right;color:var(--text-secondary);font-size:12.5px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M6.5 12.5l3.5 3.5 7.5-8"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/></symbol>
<symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9.5 2.5h5M12 2.5V6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</defs></svg>

<div class="shell">
  <div class="titlebar">
    <div class="brand"><span class="mark"><svg class="icon" width="14" height="14" style="stroke-width:2.5"><use href="#i-logo"/></svg></span>TickMate</div>
  </div>
  <div class="body">
    <aside class="sidebar">
      <div class="nav-item"><span class="ldot" style="background:#4772FA"></span>工作</div>
      <div class="nav-item"><span class="ldot" style="background:#64B94C"></span>生活</div>
      <div class="nav-item selected"><svg class="icon" width="16" height="16"><use href="#i-chart"/></svg>统计报表</div>
      <div class="nav-item"><svg class="icon" width="16" height="16"><use href="#i-timer"/></svg>番茄专注</div>
    </aside>

    <section class="main">
      <div class="main-head">
        <h1>统计报表</h1><span class="sub">10月</span>
        <div class="range"><button>周</button><button class="on">月</button><button>年</button></div>
      </div>
      <div class="content">
        <div class="kpis">
          <div class="kpi"><div class="num">42<em>个</em></div><div class="lab">本月完成任务</div><div class="delta">↑ 较上月 +12%</div></div>
          <div class="kpi"><div class="num">18<em>次</em></div><div class="lab">本月番茄</div><div class="delta">↑ 较上月 +3</div></div>
          <div class="kpi"><div class="num">7.5<em>小时</em></div><div class="lab">本月专注</div><div class="delta">↑ 较上月 +40 分钟</div></div>
          <div class="kpi"><div class="num">86<em>%</em></div><div class="lab">准时完成率</div><div class="delta">↑ 较上月 +4%</div></div>
        </div>

        <div class="card">
          <div class="card-head">番茄专注热力图<span class="sub">最近 12 周 · 每格一天 · 颜色越深专注越久</span></div>
          <div class="card-body">
            <div class="heat-months"><span style="grid-column:1/5">8月</span><span style="grid-column:5/9">9月</span><span style="grid-column:9/13">10月</span></div>
            <div class="heat">
              <div class="heat-cell l2"></div><div class="heat-cell"></div><div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell"></div><div class="heat-cell l3"></div><div class="heat-cell l1"></div>
              <div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell l4"></div><div class="heat-cell l2"></div>
              <div class="heat-cell l1"></div><div class="heat-cell"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l3"></div><div class="heat-cell"></div><div class="heat-cell l1"></div>
              <div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell"></div><div class="heat-cell l3"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l2"></div>
              <div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l3"></div><div class="heat-cell l1"></div>
              <div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell"></div><div class="heat-cell l2"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div>
              <div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l2"></div>
              <div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div>
              <div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l3"></div><div class="heat-cell l1"></div><div class="heat-cell"></div>
              <div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l4"></div>
              <div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div>
              <div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div><div class="heat-cell l2"></div><div class="heat-cell l1"></div>
            </div>
            <div class="heat-legend">少 <span class="lg-cell"></span><span class="lg-cell l1"></span><span class="lg-cell l2"></span><span class="lg-cell l3"></span><span class="lg-cell l4"></span> 多</div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">任务完成趋势<span class="sub">最近 14 天 · 每日完成数</span></div>
          <div class="card-body">
            <div class="trend">
              <div class="bar"><span class="v">3</span><div class="col" style="height:45%"></div><span class="d">18</span></div>
              <div class="bar"><span class="v">5</span><div class="col" style="height:70%"></div><span class="d">19</span></div>
              <div class="bar"><span class="v">2</span><div class="col" style="height:28%"></div><span class="d">20</span></div>
              <div class="bar"><span class="v">6</span><div class="col" style="height:85%"></div><span class="d">21</span></div>
              <div class="bar"><span class="v">4</span><div class="col" style="height:55%"></div><span class="d">22</span></div>
              <div class="bar"><span class="v">1</span><div class="col" style="height:15%"></div><span class="d">23</span></div>
              <div class="bar"><span class="v">3</span><div class="col" style="height:42%"></div><span class="d">24</span></div>
              <div class="bar"><span class="v">5</span><div class="col" style="height:70%"></div><span class="d">25</span></div>
              <div class="bar"><span class="v">2</span><div class="col" style="height:28%"></div><span class="d">26</span></div>
              <div class="bar"><span class="v">4</span><div class="col" style="height:55%"></div><span class="d">27</span></div>
              <div class="bar"><span class="v">7</span><div class="col" style="height:100%"></div><span class="d">28</span></div>
              <div class="bar"><span class="v">2</span><div class="col" style="height:28%"></div><span class="d">29</span></div>
              <div class="bar"><span class="v">4</span><div class="col" style="height:48%"></div><span class="d">30</span></div>
              <div class="bar today"><span class="v">4</span><div class="col" style="height:55%"></div><span class="d">今天</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">清单任务分布<span class="sub">进行中任务 · 按清单</span></div>
          <div class="card-body dist">
            <div class="dist-row"><span class="name"><span class="ldot" style="background:#4772FA"></span>工作</span><div class="track"><div class="fill" style="width:50%;background:#4772FA"></div></div><span class="num">8 个</span></div>
            <div class="dist-row"><span class="name"><span class="ldot" style="background:#64B94C"></span>生活</span><div class="track"><div class="fill" style="width:31%;background:#64B94C"></div></div><span class="num">5 个</span></div>
            <div class="dist-row"><span class="name"><span class="ldot" style="background:#F5A623"></span>购物</span><div class="track"><div class="fill" style="width:19%;background:#F5A623"></div></div><span class="num">3 个</span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
